name: Build and release

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -mod=readonly ./...
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.6
      - run: helm lint .helm --set image.repository=ghcr.io/example/t-cloud-cert-sync --set image.tag=v0.1.0
      - run: helm template cert-sync .helm --set image.repository=ghcr.io/example/t-cloud-cert-sync --set image.tag=v0.1.0 > /dev/null
      - run: docker build -t t-cloud-cert-sync:verify .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.6
      - run: helm package .helm --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}" --destination dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}